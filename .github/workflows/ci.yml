name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          DATABASE_URL: postgres://instant:instant@localhost:5432/instant_v2_test?sslmode=disable
        run: go test ./... -race -count=1 -short -p 1
