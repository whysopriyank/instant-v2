name: ci
on:
  push:
    branches: [main]
  pull_request:

# Least privilege (2026-08-27 audit MED-2): jobs only checkout the repo, so
# the token needs no scopes beyond read. Overriding here guards against
# org/repo-level defaults granting more than intended.
permissions:
  contents: read

# NOTE: service containers (`services:`) do not support arbitrary container
# commands, and waltail needs `postgres -c wal_level=logical` for logical
# slots. Postgres therefore runs via explicit `docker run` steps below —
# full arg control, health-checked, per-job. (GitHub Actions also ignores
# YAML anchors, so each job carries its own block.)

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://instant:instant@localhost:5432/instant_v2_test?sslmode=disable
      PGPASSWORD: instant
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Install pinned linter
        run: |
          curl -fsSLo golangci-lint.tar.gz https://github.com/golangci/golangci-lint/releases/download/v2.13.1/golangci-lint-2.13.1-linux-amd64.tar.gz && printf 'b17bfbc9d4aaa48be7f4f1ce3240bc3d8200c870c072bacf15c26219e2cfb9cc  golangci-lint.tar.gz\n' | sha256sum -c -
          tar -xzf golangci-lint.tar.gz
          sudo install -m 0755 golangci-lint-2.13.1-linux-amd64/golangci-lint /usr/local/bin/golangci-lint
          rm -rf golangci-lint.tar.gz golangci-lint-2.13.1-linux-amd64
      - name: Ensure fixture-audit prerequisite
        run: command -v rg || ( curl -fsSLo ripgrep.tar.gz https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-unknown-linux-musl.tar.gz && printf '33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c  ripgrep.tar.gz\n' | sha256sum -c - && tar -xzf ripgrep.tar.gz && sudo install -m 0755 ripgrep-15.2.0-x86_64-unknown-linux-musl/rg /usr/local/bin/rg )
      - name: Static checks and build
        run: make vet lint build
      - name: Hermetic unit and race tests
        run: make test-unit
      # Integration is explicitly enabled by Make; each testkit fixture owns
      # its database. Four-package concurrency passed the local live/race gate.
      - name: Start postgres (wal_level=logical)
        run: |
          docker rm -f ci-pg 2>/dev/null || true
          docker run -d --name ci-pg \
            -e POSTGRES_USER=instant -e POSTGRES_PASSWORD=instant \
            -e POSTGRES_DB=instant_v2_test -p 5432:5432 postgres:17@sha256:f4c66b820c6f974249089d3d16d86a3698eae11e8746eb6644b2271031e91232 \
            -c wal_level=logical -c max_connections=200
          ready=0
          for i in $(seq 1 30); do
            if docker exec ci-pg pg_isready -U instant -d instant_v2_test; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
      - name: Required isolated PostgreSQL integration tests
        run: make test-integration
      - name: Corpus contracts and real v2 replay
        run: make test-contract
      - name: Benchmark artifact acceptance
        run: make bench-acceptance
      - name: Stop disposable postgres
        if: always()
        run: docker rm -f ci-pg 2>/dev/null || true

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Container startup, health, non-root identity, and TLS roots
        run: make container-verify

  # Soak-as-gate (docs/01 §6-B follow-up): correctness gate under sustained
  # load. cmd/soak exits 1 on ANY dropped refresh or protocol violation;
  # the lag + RSS budgets guard delivery latency and unbounded growth at CI
  # scale. Budgets are deliberately generous — gates regressions, not perf.
  soak-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://instant:instant@localhost:5432/instant_bench_ci_${{ github.run_id }}_${{ github.run_attempt }}?sslmode=disable
      BENCHMARK_DB_NAME: instant_bench_ci_${{ github.run_id }}_${{ github.run_attempt }}
      PGPASSWORD: instant
      BENCHMARK_MARKER: ci-soak-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Start postgres
        run: |
          docker rm -f soak-pg 2>/dev/null || true
          docker run -d --name soak-pg \
            -e POSTGRES_USER=instant -e POSTGRES_PASSWORD=instant -e POSTGRES_DB=postgres \
            -p 5432:5432 postgres:17@sha256:f4c66b820c6f974249089d3d16d86a3698eae11e8746eb6644b2271031e91232
          ready=0
          for i in $(seq 1 30); do
            if docker exec soak-pg pg_isready -U instant -d postgres | grep -q "accepting connections"; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          # Connect through the bootstrap database; the benchmark database is
          # created with the exact name used by DATABASE_URL above.
          docker exec soak-pg createdb -U instant -d postgres "$BENCHMARK_DB_NAME"
      - name: Build server + harness
        run: |
          go build -o instantd ./cmd/instantd
          go build -o soaksetup ./cmd/soaksetup
          go build -o soak ./cmd/soak
      - name: Seed app + attr
        run: |
          ./soaksetup -database-url "$DATABASE_URL" -marker "$BENCHMARK_MARKER" | tee soaksetup.out
          APP=$(awk -F= '$1 == "APP" {print $2}' soaksetup.out)
          ATTR=$(awk -F= '$1 == "ATTR" {print $2}' soaksetup.out)
          test -n "$APP" && test -n "$ATTR"
          DB_NAME="${DATABASE_URL##*/}"
          DB_NAME="${DB_NAME%%\?*}"
          jq -n --arg app "$APP" --arg attr "$ATTR" --arg database "$DB_NAME" --arg marker "$BENCHMARK_MARKER" \
            '{app:$app, attr:$attr, database:$database, marker:$marker, setup:"soaksetup"}' > soak-setup.json
          echo "SOAK_APP=$APP" >> "$GITHUB_ENV"
          echo "SOAK_ATTR=$ATTR" >> "$GITHUB_ENV"
      - name: Start instantd
        env:
          INSTANT_V2_HTTP_ADDR: "127.0.0.1:8888"
          INSTANT_V2_INSECURE_DEV_SECRETS: "1"
        run: |
          ./instantd > instantd.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            # /runtime/sse requires app_id; /health is the unauthenticated
            # liveness endpoint and therefore catches a real server startup.
            curl --fail --max-time 3 -sS -o /dev/null http://127.0.0.1:8888/health && exit 0
            sleep 1
          done
          echo "instantd did not become ready"; tail -50 instantd.log; exit 1
      - name: Soak (150 sessions, 10s ramp + 30s warm-up + 60s measurement)
        timeout-minutes: 6
        run: |
          make soak-gate SOAK_SERVER_PID="$(cat server.pid)"
      - name: RSS ceiling (1 GiB)
        if: always()
        run: |
          PID=$(cat server.pid)
          RSS_KB=$(ps -o rss= -p "$PID" | tr -d ' ')
          echo "instantd RSS: $((RSS_KB / 1024)) MiB"
          if [ "$RSS_KB" -gt 1048576 ]; then
            echo "RSS budget exceeded"; exit 1
          fi
      - name: Dump server log on failure
        if: failure()
        run: tail -100 instantd.log
      - name: Upload short soak artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-soak-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            soaksetup.out
            soak-setup.json
            soak-events.jsonl
            soak.log
            instantd.log
          if-no-files-found: warn
          retention-days: 14
      - name: Stop disposable postgres
        if: always()
        run: docker rm -f soak-pg 2>/dev/null || true
