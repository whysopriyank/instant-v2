version: 2
project_name: instantd

builds:
  - id: instantd
    main: ./cmd/instantd
    binary: instantd
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin
        goarch: amd64
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Tag}}"]

archives:
  - formats: [tar.gz]
    name_template: "instantd_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive
    documents: ["${artifact}.spdx.json"]
    args: ["$artifact", "--output", "spdx-json=$document"]

# GoReleaser stages compiled binaries, not the source tree.
dockers_v2:
  - id: instantd
    ids: [instantd]
    dockerfile: deploy/Dockerfile.release
    extra_files: [LICENSE]
    images: [ghcr.io/whysopriyank/instant-v2]
    tags: ["{{ .Tag }}", "{{ .FullCommit }}", alpha]
    platforms: [linux/amd64, linux/arm64]
    sbom: true
    flags: ["--provenance=mode=max", "--output=type=image,oci-mediatypes=true"]
    labels:
      org.opencontainers.image.source: https://github.com/whysopriyank/instant-v2
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Tag }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: Apache-2.0

docker_signs:
  - cmd: cosign
    output: true
    args: [sign, "${artifact}@${digest}", --yes]

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    output: true
    args: [sign-blob, "--bundle=${signature}", "${artifact}", --yes]

release:
  draft: true
  prerelease: true
