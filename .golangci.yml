version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errcheck
    - ineffassign
    - staticcheck
    - govet
    - unused
    - misspell
    - copyloopvar
  settings:
    errcheck:
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (*database/sql.DB).Close
        - (*database/sql.Conn).Close
        - (*os.File).Close
        - (*github.com/coder/websocket.Conn).Close
        - (github.com/coder/websocket.Conn).Close

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
